  - id: A1
    source: brief.md
    text: A1：左→右及右→左完全对齐均能插入源独有、更新同键选定差异字段、删除目标范围内独有记录；未选字段和键不更新。默认补齐及既有合并模式仍不删除。
    result: passed
    reason:
      text: desktop/data.cpp:323 buildMerge 仅在 align 纳入目标独有删除，UPDATE
        排除键并沿用选定差异字段。tests/integration_align.py:27
        双向断言目标增改删结果、未选列保留及源端不变；d6-runtime-integration.json 同时通过双向 fill/merge
        不删除回归。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：仅完整有效扫描和可靠兼容键可生成计划；取消、失败、不完整、无键、非 InnoDB
      或依赖不可见均拒绝。共享筛选范围外记录保留，范围外同键按目标真实键语义报冲突；空源范围可列出范围内全部删除，未确认不得执行。
    result: passed
    reason:
      text: buildMerge 校验完整成功扫描、任务身份、可靠兼容键及结构基线；mergeGuard 拒绝非 InnoDB 和依赖不可见。Runtime
        实库通过
        failed/cancelled/incomplete、无键、MyISAM、共享范围保护、排序规则等价范围外同键冲突及空源/空目标/双空场景。mergeOperation:75
        与真实 Qt 检查证明非零删除缺少确认不能执行。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：预览显示实际目标、方向、模式、键、字段、共享条件或全表、读取时间、增改删数及分页
      SQL/样例；删除明细单独可查。存在删除时须明确勾选认可删除数量与范围，再作执行摘要确认；未确认、旧计划、重复请求或迟到响应均不启动额外写入。
    result: passed
    reason:
      text: DataMergePanel 展示目标、模式、键字段、范围、读取时间、数量和参数化
        SQL，独立删除分页及删除确认后再作摘要确认。tests/desktop_align.mjs:25–68 验证实际 Qt
        删除分类、未确认禁用、新计划清除确认、摘要目标与全表范围；真实 Bridge 及 merge_bridge_test.cpp:41
        验证缺少确认、失效及重复请求拒绝。已查看 d6-delete-1024.png，删除数量及整行含义可见。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：删除前在同批事务中按可靠键锁定目标，核对完整旧值及范围；目标已改、已删或移出范围、结构/权限漂移均停止并回滚本批，不覆盖并发变化。源后续变化不加入已确认快照，新增目标记录不被扩大删除。
    result: passed
    reason:
      text: desktop/data.cpp:364 executeMergeBatch 在同批事务中取得目标 MDL、复核结构基线，并按可靠键 SELECT
        FOR UPDATE 比较全部目标旧值后 DELETE，要求影响一行。Runtime
        实库验证目标已改、已删、移出范围与结构漂移均失败回滚；源后续新增与扫描后目标新键不扩大已确认删除集合。权限不足和依赖不可见受既有基线检查及实库回归覆盖。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：仅成功提交批次计入已提交；约束/SQL
      失败回滚当前批并停止后续批，先前提交保留；停止在可控边界生效。记录区分已提交、已回滚、未执行与待核实，进程异常和未知提交不自动重试。
    result: passed
    reason:
      text: executeMergeBatch 仅在 COMMIT 明确成功后返回提交数量；回滚无法确认及提交异常返回
        unknown。merge_bridge.cpp:93 advanceMerge 仅累计确认成功批次，失败或未知停止后续批次。Runtime
        验证 600 删除三批成功、后批冲突仅保留前 256 条提交，以及真实 Bridge 停止后提交 256/800、实际数据库剩余行匹配。原生进程
        fixture 覆盖 failed/unknown/crash 和待执行批次；真实网络 COMMIT 丢包未执行。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：删除保持触发器及外键启用。RESTRICT/NO ACTION 引用冲突可解释并回滚；会导致跨表删除/修改的 CASCADE、SET NULL
      和无法证明副作用边界的目标触发器阻止自动执行，预览说明具体对象。精确复合键、排序规则等价键、BIGINT/DECIMAL、NULL、二进制及完整旧值校验不失真。
    result: passed
    reason:
      text: desktop/data.cpp:290 deleteGuard 对 CASCADE、SET NULL
        及未知删除规则按具体外键对象阻止；mergeGuard 保留既有触发器边界。tests/integration_align.py:114
        分别断言 RESTRICT/NO ACTION 可预览但引用冲突回滚，CASCADE/SET NULL
        预览拒绝且子表不变；删除触发器跨表副作用被阻止。实库精确复合
        BIGINT/二进制键、DECIMAL、长文本、NULL、微秒旧值及排序规则键回归通过。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：上下文变化使旧计划及删除确认失效，执行与结构写入互斥并保护退出；持久记录含完全对齐模式、删除计划数量、实际批次结果及脱敏错误，不保存可重放业务参数。重启不恢复可执行计划，未完成记录标待核实，临时值按既有生命周期清理。
    result: passed
    reason:
      text: 前端 generation 与计划重建清除旧计划和删除确认；后端
        mergeGeneration、计划身份、连接摘要及执行互斥阻止过期或并发写入。记录增加 data-align
        和删除数量，不保存行参数；sync_bridge.cpp:100 将未完成 alignment 记录恢复为 unknown。原生
        deleteConfirmation、nativeContextLocked、stopJobsWaitsForBatch、crashRecovery(align)
        通过；真实 Qt 记录、页面重载及 D4 生命周期回归通过。沿用既有临时值清理链，无新增持久业务值。
      truncated: false
