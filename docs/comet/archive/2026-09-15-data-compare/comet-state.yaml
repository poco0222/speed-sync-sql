acceptance:
  - id: A1
    source: brief.md
    text: A1：数据页复用连接和库表配对，进入不自动扫描；换连接、表、设置或执行结构变更后旧结果失效，迟到响应不能覆盖新上下文。
    result: passed
    reason:
      text: 核对 SchemaWorkbench/DataWorkbench 的显式准备、任务代次和失效逻辑，以及 data_bridge.cpp 的
        generation/taskId 校验。真实 Qt 检查覆盖显式启动、旧任务拒绝、连接变更与恢复；进入数据页不会自动扫描业务行。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：两端可验证的主键、非空唯一键和复合键可建议与选择；不可靠键说明原因，无键表仅分别分页浏览，不按行号生成匹配结论。
    result: passed
    reason:
      text: data.cpp metadata/prepare 校验两端完整非空唯一键、复合键及类型/排序规则；排除可空、前缀及不支持键。真实 MySQL
        检查覆盖复合主键、非空唯一键、可空键拒绝、无键独立浏览和字符键身份语义。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：默认同名兼容字段，可选择参与字段；共享 AND 条件参数化应用两端，原生端拒绝非法字段、操作符和值，不兼容项明确列出。
    result: passed
    reason:
      text: 默认同名兼容字段，未参与字段及原因可见。filterSql 使用字段/操作符白名单、类型值校验和绑定参数，两端复用同一 AND
        条件。真实检查覆盖精确 BIGINT/BIT 筛选、空范围、非法操作符拒绝及字段子集。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：跨批次识别相同、不同、仅左、仅右；两端完整扫描才给出最终计数和完整结论。双端空、单端空、缺表、权限失败、断线和取消不混淆。
    result: passed
    reason:
      text: scan 每批 256 行；仅两端成功结束后发布最终缺失状态和计数。真实 2500
        行样本验证跨批次四种结果，另验证双端空、取消、缺表、权限失败。查询中断和子进程异常路径均保持
        complete=false；单端空结论有前端回归覆盖。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：BIGINT、DECIMAL、NULL、空串、0、二进制、时间和 JSON
      按类型无损处理；长值差异不因显示截断或哈希相等被漏报，不支持值明确提示。
    result: passed
    reason:
      text: 核对完整 canonical 值比较、精确数文本、JSON 精确数解析、FLOAT 提升、HEX 二进制、UTC TIMESTAMP 和定宽
        Unicode 原值存储。单元及真实 MySQL 证据覆盖
        BIGINT、DECIMAL、NULL/空串、NUL/emoji、微秒、JSON、相邻 FLOAT/DOUBLE 和长值尾部差异。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：结果分页，支持状态过滤、完整键定位、变化字段查看；详情左右对齐，长值按需加载，复制原值，搜索无匹配不显示两端一致。
    result: passed
    reason:
      text: 结果分页、状态过滤、完整键定位和变化字段均从当前临时结果读取；详情按字段左右对齐，长值按 codepoint
        分块，复制完整原值。真实桥接验证分页/定位/长值，真实桌面验证详情和系统剪贴板；无匹配提示不改变整体结论。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：后台分批扫描，真实扫描量和阶段，可停止与回收任务，界面可操作；前端不接收整表，失效/关闭清理临时结果，普通配置和日志不保存业务行或密码。
    result: passed
    reason:
      text: 扫描运行于独立
        QProcess，逐批发布实际扫描量；取消结束子进程并保持未完整，失效/关闭/启动清理临时目录。前端仅接收页和按需详情。真实取消检查通过；731
        条读取账号 SQL 审计及样本校验和确认只读，业务行仅进入任务临时存储。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：原生/前端回归、隔离 MySQL 和真实 Qt WebEngine 检查覆盖只读比对及 D1–D3 相关行为；记录实际样本、环境与未运行平台项。
    result: passed
    reason:
      text: 复用当前 Runtime 四项 exit 0 检查；核对 D4/D3 实测脚本及报告、D4 验证记录和 1024 深色截图。覆盖前端回归、6 个
        CTest 套件、18 项 D4 Qt 检查及 D3 MySQL/桌面回归；记录 macOS 27 arm64、Qt 6.10.2、MySQL
        8.0.46、实际样本与平台待办。
      truncated: false
