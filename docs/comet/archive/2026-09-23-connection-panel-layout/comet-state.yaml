acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: A1 连接区单行化 - WHEN 打开比对工作台并查看顶部连接区（任一状态：未选连接 / 已选连接 / 测试进行中） -
      THEN 每侧呈现「来源/目标 行内标签 + 连接选择器 + 测试连接按钮 +
      编辑按钮」的单行控件组，不再渲染独立的大标题行；来源/目标角色标识始终直接可见，不依赖颜色或悬停。"
    result: passed
    reason:
      text: diff 删除 Typography.Title 大标题、新增控件行内 .endpoint-label
        行内标签(13px/600/nowrap),1440
        明暗截图均呈现「标签+Select+测试+编辑」单行控件组,来源/目标为普通文本始终直接可见。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A2 对换按钮对齐 - WHEN 两侧详情高度不一致（例如一侧测试失败带长错误文案、另一侧成功或未测试） - THEN
      对换按钮与两侧控件行对齐（顶部与控件行同一起线），不再垂直悬浮于整条栏的几何中心。"
    result: passed
    reason:
      text: .connection-bar 由 align-items:center 改为 start,对换按钮作为 grid item
        顶部对齐;.endpoint 为 flex column 且首行即控件行,两侧详情高度不等时对换按钮仍与控件行同一起线,截图确认水平对齐。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A3 状态行合并 - THEN
      每侧的主机地址、测试结果标签与原因、测试时间合并为一个紧凑状态区：时间戳不再独立占一行；长错误文案可自然换行但保持完整可读。未选择连接时该位置显示\
      「尚未选择连接」次要提示；测试进行中显示既有「正在测试连接… 已用时 X 秒」文案。"
    result: passed
    reason:
      text: .endpoint-detail 改为 flex-wrap 行内流且 .endpoint-detail .test-result
        time{flex-basis:auto}
        使连接区时间戳并入状态行(连接管理页保持独立占行属预期范围外),未选连接渲染「尚未选择连接」次要提示,busy
        分支文案原样保留,截图确认主机+Tag+失败原因+时间一行合并且长错误文案完整可读。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: A4 响应式与主题 - THEN 在 1920px、≤1050px、≤750px 三档宽度下连接区无横向溢出；≤750px
      时两侧堆叠为单列，对换按钮在堆叠视图中水平居中；浅色与深色主题下均正常渲染。"
    result: passed
    reason:
      text: 1440 明/暗截图无横向溢出(与 1920 同一 CSS 分支),700px 截图确认 ≤750 单列堆叠、对换按钮经
        .connection-bar>.ant-btn{justify-self:center} 水平居中且无溢出;1050 档媒体查询仅收窄
        gap/padding、网格结构不变,结合 minmax(0,1fr) 弹性列判定无溢出。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: A5 回归不破坏 - THEN `npm run build`（tsc --noEmit + vite build）与
      `npm test` 全部通过；连接选择、测试、编辑、新建、对换的交互行为、禁用条件与现有
      `aria-label`（来源连接/目标连接/选择来源连接/选择目标连接）保持不变。"
    result: passed
    reason:
      text: Runtime 回执 frontend-build 与 frontend-test 均 passed(exitCode 0,日志核对 34/34
        测试通过),git diff 确认 section/Select 的 aria-label 原样保留,按钮
        icon/loading/disabled 与对换禁用条件未变,ResultText 组件未改动。
      truncated: false
